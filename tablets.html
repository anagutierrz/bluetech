    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap');
        :root { --font-titles: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif; }
        body { font-family: var(--font-body); background-color: #0A0F1D; color: #F8FAFC; text-align: left; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        h1, h2, h3 { font-family: var(--font-titles); letter-spacing: -0.04em; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* SIDEBAR MÓVIL UNIFICADO */
        #mobile-sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; }
        #mobile-sidebar.active { right: 0; }
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1500; }
        #sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        body.overflow-hidden { overflow: hidden; }

        .list-row { transition: all 0.3s ease; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 10px; }
        .list-row:hover { background: rgba(37, 99, 235, 0.12); border-color: rgba(37, 99, 235, 0.5); transform: translateY(-2px); }
        .spec-pill-storage { background: rgba(37, 99, 235, 0.2); border: 1px solid rgba(37, 99, 235, 0.4); color: #93c5fd; }
        .spec-pill-ram { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #cbd5e1; }
        .spec-pill-inches { background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .category-pill { transition: all 0.3s ease; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
        .category-pill.active { background: #2563EB; border-color: #2563EB; color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <div id="sidebar-overlay"></div>

    <nav class="fixed w-full z-[160] px-4 md:px-6 py-4 text-left">
        <div class="max-w-7xl mx-auto glass rounded-full px-6 py-3 flex justify-between items-center relative">
            <a href="index.html"><img src="./logoblancoblue.png" alt="Logo" class="h-10 md:h-14 w-auto"></a>
            <div class="hidden lg:flex items-center gap-8 text-[11px] font-black uppercase tracking-widest text-white">
                <a href="index.html" class="hover:text-bt-primary transition">Inicio</a>
                <a href="laptops.html" class="hover:text-bt-primary transition">Laptops</a>
                <a href="celulares.html" class="hover:text-bt-primary transition">Celulares</a>
                <a href="mundogaming.html" class="hover:text-bt-primary transition">Gaming</a>
                <a href="tablets.html" class="text-bt-primary transition">Tablets</a>
                <a href="https://wa.me/1809XXXXXXX" target="_blank" class="bg-whatsapp px-5 py-2.5 rounded-full font-bold">WhatsApp</a>
            </div>
            <button id="open-sidebar" class="lg:hidden text-white text-3xl p-2 focus:outline-none">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
        </div>
    </nav>

    <div id="mobile-sidebar" class="glass p-10 flex flex-col gap-6 lg:hidden text-left">
        <div class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
            <img src="./logoblancoblue.png" alt="Logo" class="h-8 w-auto">
            <button id="close-sidebar" class="text-white text-3xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex flex-col gap-6 text-xl font-black uppercase tracking-tighter text-white">
            <a href="index.html">Inicio</a>
            <a href="laptops.html">Laptops</a>
            <a href="celulares.html">Celulares</a>
            <a href="mundogaming.html">Mundo Gaming</a>
            <a href="tablets.html" class="text-bt-primary">Tablets</a>
            <a href="https://wa.me/1809XXXXXXX" class="bg-whatsapp text-center py-4 rounded-2xl mt-6 text-sm">WhatsApp Business</a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 md:px-6 pt-36 md:pt-48 pb-20 text-left">
        <div class="mb-10">
            <h1 class="text-4xl md:text-5xl font-black mb-4 uppercase">Listado <span class="text-bt-primary italic">Tablets.</span></h1>
            <div class="flex flex-col md:flex-row gap-6 md:items-center justify-between">
                <div class="relative max-w-xl w-full">
                    <input type="text" id="tablet-search" placeholder="Busca por modelo o marca..." 
                           class="w-full bg-bt-card border border-bt-border rounded-2xl py-4 px-6 pl-14 focus:ring-2 focus:ring-bt-primary focus:outline-none transition-all text-sm text-white">
                    <i class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
                <div id="results-count" class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em]">Sincronizando...</div>
            </div>
            <div id="brand-filters" class="flex flex-wrap gap-2 mt-8 overflow-x-auto pb-2 no-scrollbar">
                <button class="category-pill active bg-white/5 px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest" data-brand="all">Todas las Marcas</button>
            </div>
        </div>

        <div class="rounded-[2rem] overflow-hidden animate__animated animate__fadeIn">
            <div class="hidden md:grid grid-cols-6 bg-white/5 p-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-300 border-b border-bt-border gap-4">
                <div class="col-span-1">Modelo</div>
                <div class="col-span-1 text-center">Almacenamiento / RAM</div>
                <div class="col-span-1 text-center">Pantalla</div>
                <div class="col-span-1 text-center">Condición</div>
                <div class="col-span-1 text-center">Precio RD$</div>
                <div class="col-span-1 text-right">WhatsApp</div>
            </div>
            <div id="loader" class="text-center py-20"><i class="fa-solid fa-circle-notch animate-spin text-bt-primary text-3xl"></i></div>
            <div id="tablet-list-container" class="hidden"></div>
        </div>
    </main>

    <footer class="bg-bt-deep border-t border-white/5 py-12 text-left">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest italic text-left">&copy; 2026 Bluetech Solutions RD</p>
            <div class="flex items-center gap-1.5 text-[9px] font-black uppercase tracking-widest italic text-left">
                <span class="text-slate-500 text-left">Powered by</span>
                <a href="https://auragency.net/" target="_blank" class="text-bt-primary hover:text-white transition-all text-left">Aura Agency</a>
            </div>
        </div>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx90xObT5MZ27r7tx5j6cA07hPqur8OVvxKtgzZbcKmxTwM8U4cSwEprpEsjZnawZ-K/exec';
        let allTablets = [];
        let currentBrand = 'all';

        // SIDEBAR LOGIC
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');
        const sidebar = document.getElementById('mobile-sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.classList.toggle('overflow-hidden');
        }

        openBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP', minimumFractionDigits: 0 }).format(amount).replace('DOP', 'RD$');
        };

        async function fetchTablets() {
            try {
                const response = await fetch(GAS_URL + '?sheet=Tablet', { method: 'GET', redirect: 'follow' });
                allTablets = await response.json();
                generateBrandFilters(allTablets);
                renderTablets(allTablets);
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('tablet-list-container').classList.remove('hidden');
            } catch (error) { 
                console.error("Error:", error); 
                document.getElementById('loader').innerHTML = '<p class="text-red-500 font-bold">Error de sincronización</p>';
            }
        }

        function generateBrandFilters(data) {
            const filterContainer = document.getElementById('brand-filters');
            const brands = [...new Set(data.map(item => item.marca).filter(Boolean))];
            brands.forEach(brand => {
                const button = document.createElement('button');
                button.className = 'category-pill bg-white/5 px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest';
                button.innerText = brand;
                button.dataset.brand = brand;
                button.onclick = () => filterByBrand(brand, button);
                filterContainer.appendChild(button);
            });
        }

        function filterByBrand(brand, element) {
            document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            currentBrand = brand;
            applyFilters();
        }

        function applyFilters() {
            const term = document.getElementById('tablet-search').value.toLowerCase();
            const filtered = allTablets.filter(t => {
                const matchesSearch = t.modelo.toLowerCase().includes(term) || t.marca.toLowerCase().includes(term);
                const matchesBrand = currentBrand === 'all' || t.marca === currentBrand;
                return matchesSearch && matchesBrand;
            });
            renderTablets(filtered);
        }

        function renderTablets(data) {
            const container = document.getElementById('tablet-list-container');
            const countDisplay = document.getElementById('results-count');
            countDisplay.innerText = `${data.length} Unidades disponibles`;

            container.innerHTML = data.map(tablet => `
                <div class="list-row p-6 flex flex-col md:grid md:grid-cols-6 gap-4 md:items-center text-left rounded-xl">
                    <div class="flex flex-col text-left">
                        <span class="text-bt-primary font-black text-[9px] uppercase tracking-widest mb-1">${tablet.marca || 'Tablet'}</span>
                        <div class="text-white font-black text-xl md:text-sm uppercase tracking-tighter">${tablet.modelo}</div>
                    </div>
                    <div class="flex gap-2 md:justify-center text-left">
                        <span class="spec-pill-storage text-[10px] font-bold px-3 py-1.5 rounded-lg">${tablet.almacenamiento || tablet.gb || '-'}</span>
                        <span class="spec-pill-ram text-[10px] font-bold px-3 py-1.5 rounded-lg">${tablet.ram || '-'}</span>
                    </div>
                    <div class="md:text-center text-left">
                        <span class="md:hidden text-[7px] text-slate-500 uppercase font-black mb-1 block">Tamaño</span>
                        <span class="spec-pill-inches text-[10px] font-bold px-3 py-1.5 rounded-lg inline-block">${tablet.pulgadas || '-'}''</span>
                    </div>
                    <div class="md:text-center text-left">
                        <span class="bg-bt-card text-slate-300 text-[9px] px-3 py-1 rounded uppercase font-black border border-bt-border">${tablet.condicion || tablet.clase || 'Excelente'}</span>
                    </div>
                    <div class="md:text-center text-left">
                        <span class="md:hidden text-[8px] text-slate-500 uppercase font-black block mb-1 tracking-widest text-left">Inversión Final</span>
                        <span class="text-white font-black text-2xl md:text-lg tracking-tighter">${formatCurrency(tablet.precio)}</span>
                    </div>
                    <div class="flex md:justify-end text-left">
                        <a href="https://wa.me/1809XXXXXXX?text=Hola!%20Me%20interesa%20la%20tablet%20${encodeURIComponent(tablet.modelo)}" 
                           target="_blank"
                           class="w-full md:w-auto bg-bt-primary text-white py-4 md:py-2 px-6 rounded-xl md:rounded-lg text-center text-xs font-black hover:bg-white hover:text-bt-primary transition-all duration-300">
                            <i class="fa-brands fa-whatsapp text-lg md:mr-0 mr-2"></i>
                            <span class="md:hidden">Consultar ahora</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('tablet-search').addEventListener('input', applyFilters);
        document.querySelector('[data-brand="all"]').onclick = function() { filterByBrand('all', this); };
        document.addEventListener('DOMContentLoaded', fetchTablets);
    </script>
</body>
</html>

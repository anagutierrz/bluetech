<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bt-deep': '#0A0F1D',
                        'bt-primary': '#2563EB',
                        'bt-card': '#161E31',
                        'whatsapp': '#25D366'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap');
        :root { --font-titles: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif; }
        body { font-family: var(--font-body); background-color: #0A0F1D; color: #F8FAFC; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        h1, h2, h3 { font-family: var(--font-titles); letter-spacing: -0.04em; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* SIDEBAR MÓVIL UNIFICADO */
        #mobile-sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; }
        #mobile-sidebar.active { right: 0; }
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1500; }
        #sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        body.overflow-hidden { overflow: hidden; }

        .filter-btn { border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease; }
        .filter-btn.active { background-color: #2563EB; color: white; border-color: #2563EB; }
        .gaming-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .gaming-card:hover { transform: translateY(-5px); border-color: rgba(37, 99, 235, 0.4); box-shadow: 0 15px 30px rgba(37, 99, 235, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased text-left">

    <div id="sidebar-overlay"></div>

    <nav class="fixed w-full z-[160] px-4 md:px-6 py-4">
        <div class="max-w-7xl mx-auto glass rounded-full px-6 py-3 flex justify-between items-center relative">
            <a href="index.html"><img src="./logoblancoblue.png" alt="Logo" class="h-10 md:h-14 w-auto"></a>
            
            <div class="hidden lg:flex items-center gap-8 text-[11px] font-black uppercase tracking-widest text-white">
                <a href="index.html" class="hover:text-bt-primary transition">Inicio</a>
                <a href="laptops.html" class="hover:text-bt-primary transition text-white">Laptops</a>
                <a href="celulares.html" class="hover:text-bt-primary transition text-white">Celulares</a>
                <a href="mundogaming.html" class="text-bt-primary transition text-white">Mundo Gaming</a>
                <a href="tablets.html" class="hover:text-bt-primary transition text-white text-left">Tablets</a>
                <a href="https://wa.me/1809XXXXXXX" target="_blank" class="bg-whatsapp px-5 py-2.5 rounded-full font-bold">WhatsApp</a>
            </div>

            <button id="open-sidebar" class="lg:hidden text-white text-3xl p-2 focus:outline-none">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
        </div>
    </nav>

    <div id="mobile-sidebar" class="glass p-10 flex flex-col gap-6 lg:hidden text-left">
        <div class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
            <img src="./logoblancoblue.png" alt="Logo" class="h-8 w-auto">
            <button id="close-sidebar" class="text-white text-3xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex flex-col gap-6 text-xl font-black uppercase tracking-tighter text-white">
            <a href="index.html">Inicio</a>
            <a href="laptops.html">Laptops</a>
            <a href="celulares.html">Celulares</a>
            <a href="mundogaming.html" class="text-bt-primary">Mundo Gaming</a>
            <a href="tablets.html">Tablets</a>
            <a href="https://wa.me/1809XXXXXXX" class="bg-whatsapp text-center py-4 rounded-2xl mt-6 text-sm">WhatsApp Business</a>
        </div>
    </div>

    <header class="pt-36 md:pt-40 pb-8 px-6 max-w-7xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-black text-white tracking-tighter mb-8 uppercase">
            Listado <span class="text-bt-primary italic">Gaming.</span>
        </h1>
        
        <div class="relative max-w-xl w-full mb-8">
            <input type="text" id="gaming-search" placeholder="Busca teclados, mouse, etc..." 
                   class="w-full bg-bt-card/40 border border-white/5 rounded-xl py-3 px-5 pl-12 focus:ring-1 focus:ring-bt-primary focus:outline-none text-xs text-white">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        </div>

        <div class="flex flex-wrap gap-2 overflow-x-auto no-scrollbar pb-2">
            <button onclick="filterProducts('todos')" class="filter-btn active px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest">Todos</button>
            <button onclick="filterProducts('Teclados mecanicos')" class="filter-btn px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest">Teclados</button>
            <button onclick="filterProducts('Bocinas')" class="filter-btn px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest">Bocinas</button>
            <button onclick="filterProducts('Headphones')" class="filter-btn px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest">Headphones</button>
            <button onclick="filterProducts('Mouse')" class="filter-btn px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest">Mouse</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-32">
        <div id="loader" class="text-bt-primary font-black animate-pulse text-[9px] uppercase tracking-widest mb-10">Sincronizando arsenal...</div>
        <div id="gaming-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            </div>
    </main>

    <footer class="bg-bt-deep border-t border-white/5 py-12 text-left">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest italic">&copy; 2026 Bluetech Solutions RD</p>
            <div class="flex items-center gap-1.5 text-[9px] font-black uppercase tracking-widest italic text-left">
                <span class="text-slate-500">Powered by</span>
                <a href="https://auragency.net/" target="_blank" class="text-bt-primary hover:text-white transition-all">Aura Agency</a>
            </div>
        </div>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx90xObT5MZ27r7tx5j6cA07hPqur8OVvxKtgzZbcKmxTwM8U4cSwEprpEsjZnawZ-K/exec';
        let allProducts = [];

        // SIDEBAR LOGIC
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');
        const sidebar = document.getElementById('mobile-sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.classList.toggle('overflow-hidden');
        }

        openBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        async function fetchGaming() {
            try {
                const response = await fetch(GAS_URL + '?sheet=Gaming');
                allProducts = await response.json();
                renderProducts(allProducts);
                document.getElementById('loader').classList.add('hidden');
            } catch (e) { console.error("Error cargando Gaming:", e); }
        }

        function renderProducts(items) {
            const grid = document.getElementById('gaming-grid');
            grid.innerHTML = items.map(p => `
                <div class="gaming-card glass rounded-[1.5rem] p-4 border border-white/5 flex flex-col group text-left">
                    <div class="h-44 rounded-xl overflow-hidden mb-4 bg-bt-deep border border-white/5 relative">
                        <img src="${p.imagen}" class="w-full h-full object-contain p-3 group-hover:scale-105 transition duration-500" loading="lazy" alt="${p.modelo}">
                        ${parseInt(p.cantidad) <= 0 ? '<span class="absolute top-2 right-2 bg-red-600/90 text-white text-[7px] font-black px-2 py-0.5 rounded-full uppercase">Agotado</span>' : ''}
                    </div>
                    <span class="text-bt-primary font-black text-[8px] uppercase tracking-widest mb-1">${p.marca}</span>
                    <h3 class="text-sm font-black text-white mb-4 uppercase tracking-tight leading-tight h-10 line-clamp-2">${p.modelo}</h3>
                    <div class="mt-auto flex justify-between items-center">
                        <span class="text-white font-black text-lg tracking-tighter">RD$ ${new Intl.NumberFormat().format(p.precio)}</span>
                        <a href="https://wa.me/1809XXXXXXX?text=Hola,%20me%20interesa%20el%20${encodeURIComponent(p.modelo)}" 
                           class="bg-bt-primary text-white p-2.5 rounded-xl hover:bg-white hover:text-bt-primary transition duration-300">
                           <i class="fa-brands fa-whatsapp text-sm"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = cat === 'todos' ? allProducts : allProducts.filter(p => p.categoria.toLowerCase().includes(cat.toLowerCase()));
            renderProducts(filtered);
        }

        document.getElementById('gaming-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.modelo.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term));
            renderProducts(filtered);
        });

        document.addEventListener('DOMContentLoaded', fetchGaming);
    </script>
</body>
</html>

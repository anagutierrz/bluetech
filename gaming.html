<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Gaming | Bluetech Pro Gear</title>
    <link rel="icon" type="image/png" href="logoblancoblue.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bt-deep': '#0A0F1D',
                        'bt-primary': '#2563EB',
                        'bt-accent': '#FBBD23',
                        'whatsapp': '#25D366'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0A0F1D; color: #F8FAFC; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; letter-spacing: -0.04em; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .filter-btn { border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .filter-btn.active { background-color: #2563EB; color: white; border-color: #2563EB; }
    </style>
</head>
<body class="antialiased text-left">

    <nav class="fixed w-full z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto glass rounded-[2.5rem] px-8 py-3 flex justify-between items-center relative">
            <a href="index.html" class="flex items-center group">
                <img src="./logoblancoblue.png" alt="Logo" class="h-12 md:h-16 w-auto object-contain">
            </a>
            <div class="hidden lg:flex items-center gap-8 text-[11px] font-black uppercase tracking-widest">
                <a href="index.html" class="hover:text-bt-primary transition text-white">Inicio</a>
                <a href="laptops.html" class="hover:text-bt-primary transition text-white">Laptops</a>
                <a href="celulares.html" class="hover:text-bt-primary transition text-white">Celulares</a>
                <a href="tablets.html" class="hover:text-bt-primary transition text-white">Tablets</a>
                <a href="https://wa.me/1809XXXXXXX" target="_blank" class="bg-whatsapp text-white px-6 py-2.5 rounded-full font-bold">WhatsApp</a>
            </div>
        </div>
    </nav>

    <header class="pt-44 pb-12 px-6 max-w-7xl mx-auto text-left">
        <span class="text-bt-primary font-black text-[10px] uppercase tracking-[0.3em] mb-4 block">Elite Gaming Gear</span>
        <h1 class="text-6xl md:text-8xl font-black text-white tracking-tighter leading-none mb-10 uppercase italic">Mundo <span class="text-bt-primary">Gaming</span></h1>
        
        <div class="flex flex-wrap gap-3">
            <button onclick="filterProducts('todos')" class="filter-btn active px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Todos</button>
            <button onclick="filterProducts('Teclados mecanicos')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Teclados Mecánicos</button>
            <button onclick="filterProducts('Bocinas')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Bocinas</button>
            <button onclick="filterProducts('Headphones')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Headphones</button>
            <button onclick="filterProducts('Mouse')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Mouse</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-40">
        <div id="loader" class="text-bt-primary font-black animate-pulse text-[10px] uppercase tracking-widest mb-10">Conectando con la base de datos Gaming...</div>
        <div id="gaming-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="bg-bt-deep border-t border-white/5 py-10 text-left">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <img src="./logoblancoblue.png" alt="Bluetech" class="h-10 w-auto">
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.2em]">Santo Domingo, RD • @bluetech014</p>
            </div>
            <div class="flex flex-col items-center md:items-end gap-2">
                <p class="text-slate-600 text-[9px] uppercase tracking-[0.3em] font-bold">&copy; 2026 Bluetech Solutions</p>
                <div class="flex items-center gap-1.5 text-[9px] font-black uppercase tracking-widest">
                    <span class="text-slate-500">Powered by</span>
                    <a href="https://auragency.net/" target="_blank" class="text-bt-primary hover:text-white transition-all">Aura Agency</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // URL de tu Apps Script que ya maneja las hojas
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx90xObT5MZ27r7tx5j6cA07hPqur8OVvxKtgzZbcKmxTwM8U4cSwEprpEsjZnawZ-K/exec';
        let allProducts = [];

        async function fetchGaming() {
            try {
                // Forzamos la consulta a la pestaña "Gaming"
                const response = await fetch(GAS_URL + '?sheet=Gaming');
                const data = await response.json();
                allProducts = data;
                renderProducts(allProducts);
                document.getElementById('loader').classList.add('hidden');
            } catch (error) {
                console.error("Error al cargar la hoja Gaming:", error);
                document.getElementById('loader').innerHTML = "Error al sincronizar con Sheets.";
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('gaming-grid');
            grid.innerHTML = items.map(p => `
                <div class="glass rounded-[2.5rem] p-6 border border-white/5 flex flex-col group hover:border-bt-primary transition-all duration-500 text-left">
                    <div class="h-64 rounded-[1.5rem] overflow-hidden mb-6 bg-bt-deep border border-white/5 relative">
                        <img src="${p.imagen}" class="w-full h-full object-contain p-4 group-hover:scale-110 transition duration-500">
                        ${p.cantidad <= 0 ? '<span class="absolute top-4 right-4 bg-red-600 text-white text-[8px] font-black px-3 py-1 rounded-full uppercase">Agotado</span>' : ''}
                    </div>
                    <span class="text-bt-primary font-black text-[9px] uppercase tracking-widest mb-1">${p.marca}</span>
                    <h3 class="text-2xl font-black text-white mb-4 uppercase tracking-tighter leading-tight">${p.modelo}</h3>
                    <div class="mt-auto flex justify-between items-center">
                        <div>
                            <p class="text-slate-500 text-[9px] uppercase font-bold tracking-widest">Precio Final</p>
                            <span class="text-white font-black text-2xl tracking-tighter">RD$ ${new Intl.NumberFormat().format(p.precio)}</span>
                        </div>
                        <a href="https://wa.me/1809XXXXXXX?text=Hola,%20me%20interesa%20el%20${encodeURIComponent(p.modelo)}" 
                           class="bg-bt-primary text-white p-4 rounded-2xl hover:bg-white hover:text-bt-primary transition duration-300">
                           <i class="fa-brands fa-whatsapp text-xl"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(cat) {
            // Actualizar estilo de botones
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase().includes(cat.toLowerCase()) || (cat === 'todos' && btn.innerText === 'Todos')) {
                    btn.classList.add('active');
                }
            });

            const filtered = cat === 'todos' ? allProducts : allProducts.filter(p => p.categoria.toLowerCase() === cat.toLowerCase());
            renderProducts(filtered);
        }

        document.addEventListener('DOMContentLoaded', fetchGaming);
    </script>
</body>
</html>
